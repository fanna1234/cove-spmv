name: Host checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S structural -B structural/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build structural/build --parallel 2
      - name: Test
        run: ctest --test-dir structural/build --output-on-failure
      - name: Test Python tooling
        run: |
          python3 -m pip install 'pytest>=8,<9'
          python3 -m compileall -q structural/scripts
          python3 -m pytest -q structural/tests
